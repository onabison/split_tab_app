# PowerSync Sync Streams config for split_tab_app (Milestone 1)
#
# Version-controlled reference copy of what's deployed in the PowerSync
# dashboard's "Sync Streams" editor. PowerSync's replication role
# (powersync_role) bypasses Postgres RLS entirely, so this file is what
# actually enforces "you only sync data for trips you belong to."
#
# Queries are kept single-line -- the dashboard's YAML parser choked on
# multi-line folded scalars during setup, so single-line avoids that.
config:
  edition: 3
streams:
  trip_data:
    auto_subscribe: true
    queries:
      - SELECT trip.* FROM trip INNER JOIN trip_membership ON trip_membership.trip_id = trip.id WHERE trip_membership.person_id = auth.user_id()
      - SELECT trip_membership.* FROM trip_membership INNER JOIN trip_membership me ON me.trip_id = trip_membership.trip_id WHERE me.person_id = auth.user_id()
      - SELECT person.* FROM person INNER JOIN trip_membership tm ON tm.person_id = person.id INNER JOIN trip_membership me ON me.trip_id = tm.trip_id WHERE me.person_id = auth.user_id()
      - SELECT expense.* FROM expense INNER JOIN trip_membership ON trip_membership.trip_id = expense.trip_id WHERE trip_membership.person_id = auth.user_id()
      - SELECT expense_item.* FROM expense_item INNER JOIN expense ON expense.id = expense_item.expense_id INNER JOIN trip_membership ON trip_membership.trip_id = expense.trip_id WHERE trip_membership.person_id = auth.user_id()
      - SELECT claim.* FROM claim INNER JOIN expense_item ON expense_item.id = claim.item_id INNER JOIN expense ON expense.id = expense_item.expense_id INNER JOIN trip_membership ON trip_membership.trip_id = expense.trip_id WHERE trip_membership.person_id = auth.user_id()
      - SELECT payment.* FROM payment INNER JOIN trip_membership ON trip_membership.trip_id = payment.trip_id WHERE trip_membership.person_id = auth.user_id()
